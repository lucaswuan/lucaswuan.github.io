<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">

  <meta property="og:image" content="{{site}}/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The homepage of Lucas Wu’s portfolio: “Hello, I’m Lucas Wu!” beside an Earth drawn in ASCII characters.">

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="inner-page">
  <a class="skip-link" href="#main">Skip to projects</a>
  <canvas id="stars" aria-hidden="true"></canvas>
  {{header}}
  <main id="main" class="portfolio-index section-shell">
    <div class="page-bar"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">home</a><span aria-hidden="true">/</span><span aria-current="page">projects</span></nav><a class="outline-link page-back" href="/#projects"><span class="chevron back" aria-hidden="true"></span> Back to home</a></div>
    <header class="index-heading">
      <h1>My <em>projects.</em></h1>
    </header>
    <div class="index-toolbar"><span>All projects / {{count}}</span></div>
    <div class="project-grid archive-grid">{{cards}}</div>
    <div class="index-bottom"><p>Have something in mind?</p><a class="outline-link" href="/#contact">Let’s get in touch <span class="chevron" aria-hidden="true"></span></a></div>
  </main>
  {{footer}}
</body>
</html>
